apiVersion: v3.0.2
kind: DataContract
id: babel-lag-gold-item-pageviews
name: gold_item_pageviews
version: 1.0.0
status: active
domain: knowledge-spread
dataProduct: babel-lag
description:
  purpose: Human pageviews per item, language and day for the slice days.
  usage: Aggregates for the Babel Lag site and method; never per-editor analysis.
  limitations: Wikipedia only; milestone 2 covers a 20-language slice (ADR-007).
team:
- username: babel-lag
  role: owner
servers:
- server: local
  type: local
  format: delta
  path: data/lake/gold/gold_item_pageviews
schema:
- name: gold_item_pageviews
  physicalName: gold_item_pageviews
  physicalType: table
  logicalType: object
  description: Human pageviews per item, language and day for the slice days.
  tags:
  - gold
  - public-aggregate
  properties:
  - name: wiki
    logicalType: string
    physicalType: 'arro3.core.DataType<Utf8>

      '
    description: Language edition.
    classification: public
  - name: item_id
    logicalType: string
    physicalType: 'arro3.core.DataType<Int64>

      '
    description: Wikidata item number.
    classification: public
  - name: day
    logicalType: string
    physicalType: 'arro3.core.DataType<Date32>

      '
    description: Day (UTC).
    classification: public
  - name: views
    logicalType: string
    physicalType: 'arro3.core.DataType<Int64>

      '
    description: Pageviews of the item's article that day (redirect titles not attributed).
    classification: public
slaProperties:
- property: frequency
  value: 1440
  unit: m
tags:
- babel-lag
- gold
customProperties:
- property: license
  value: CC0 (Wikimedia)
- property: containsPersonalData
  value: 'false'
