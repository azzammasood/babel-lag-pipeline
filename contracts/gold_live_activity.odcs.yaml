apiVersion: v3.0.2
kind: DataContract
id: babel-lag-gold-live-activity
name: gold_live_activity
version: 1.0.0
status: active
domain: knowledge-spread
dataProduct: babel-lag
description:
  purpose: Live activity per wiki in 15-minute event-time windows; late events counted apart.
  usage: Aggregates for the Babel Lag site and method; never per-editor analysis.
  limitations: Wikipedia only; milestone 2 covers a 20-language slice (ADR-007).
team:
- username: babel-lag
  role: owner
servers:
- server: local
  type: local
  format: delta
  path: data/lake/gold/gold_live_activity
schema:
- name: gold_live_activity
  physicalName: gold_live_activity
  physicalType: table
  logicalType: object
  description: Live activity per wiki in 15-minute event-time windows; late events counted apart.
  tags:
  - gold
  - public-aggregate
  properties:
  - name: window_start
    logicalType: string
    physicalType: 'arro3.core.DataType<Timestamp(µs, "UTC")>

      '
    description: Start of the 15-minute event-time window (UTC).
    classification: public
  - name: wiki
    logicalType: string
    physicalType: 'arro3.core.DataType<Utf8>

      '
    description: Wiki database name.
    classification: public
  - name: events
    logicalType: string
    physicalType: 'arro3.core.DataType<Decimal128(38, 0)>

      '
    description: On-time events in the window.
    classification: public
  - name: late_events
    logicalType: string
    physicalType: 'arro3.core.DataType<Decimal128(38, 0)>

      '
    description: Late events (silver flag) whose window had already been reported.
    classification: public
  - name: bot_events
    logicalType: string
    physicalType: 'arro3.core.DataType<Decimal128(38, 0)>

      '
    description: On-time events flagged as bot edits.
    classification: public
  - name: human_article_edits
    logicalType: string
    physicalType: 'arro3.core.DataType<Decimal128(38, 0)>

      '
    description: Non-bot edits and page creations in namespace 0 (recentchange).
    classification: public
  - name: new_articles
    logicalType: string
    physicalType: 'arro3.core.DataType<Decimal128(38, 0)>

      '
    description: Non-bot, non-redirect article creations (page-create stream).
    classification: public
slaProperties:
- property: frequency
  value: 30
  unit: m
tags:
- babel-lag
- gold
customProperties:
- property: license
  value: CC0 (Wikimedia)
- property: containsPersonalData
  value: 'false'
