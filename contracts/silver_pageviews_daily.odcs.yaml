apiVersion: v3.0.2
kind: DataContract
id: babel-lag-silver-pageviews-daily
name: silver_pageviews_daily
version: 1.0.0
status: active
domain: knowledge-spread
dataProduct: babel-lag
description:
  purpose: Human pageviews per article and day for the slice wikis, access types summed.
  usage: Aggregates for the Babel Lag site and method; never per-editor analysis.
  limitations: Wikipedia only; milestone 2 covers a 20-language slice (ADR-007).
team:
- username: babel-lag
  role: owner
servers:
- server: local
  type: local
  format: delta
  path: data/lake/silver/silver_pageviews_daily
schema:
- name: silver_pageviews_daily
  physicalName: silver_pageviews_daily
  physicalType: table
  logicalType: object
  description: Human pageviews per article and day for the slice wikis, access types summed.
  tags:
  - silver
  - public-aggregate
  properties:
  - name: wiki
    logicalType: string
    physicalType: 'arro3.core.DataType<Utf8>

      '
    description: Wiki database name.
    classification: public
  - name: page_id
    logicalType: string
    physicalType: 'arro3.core.DataType<Int64>

      '
    description: Page id, null when Wikimedia could not resolve it.
    classification: public
  - name: page_title
    logicalType: string
    physicalType: 'arro3.core.DataType<Utf8>

      '
    description: Title as requested.
    classification: public
  - name: day
    logicalType: string
    physicalType: 'arro3.core.DataType<Date32>

      '
    description: Day (UTC).
    classification: public
  - name: views
    logicalType: string
    physicalType: 'arro3.core.DataType<Int64>

      '
    description: Pageviews by the user agent class that day.
    classification: public
  - name: source_file
    logicalType: string
    physicalType: 'arro3.core.DataType<Utf8>

      '
    description: Dump file URL the row was parsed from.
    classification: public
  - name: source_sha256
    logicalType: string
    physicalType: 'arro3.core.DataType<Utf8>

      '
    description: SHA-256 of the downloaded dump file.
    classification: public
  - name: fetched_at
    logicalType: string
    physicalType: 'arro3.core.DataType<Timestamp(µs, "UTC")>

      '
    description: UTC time the dump file was downloaded.
    classification: public
slaProperties:
- property: frequency
  value: 1440
  unit: m
tags:
- babel-lag
- silver
customProperties:
- property: license
  value: CC0 (Wikimedia)
- property: containsPersonalData
  value: 'false'
