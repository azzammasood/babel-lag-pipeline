apiVersion: v3.0.2
kind: DataContract
id: babel-lag-export-languages
name: export_languages
version: 1.0.0
status: active
domain: knowledge-spread
dataProduct: babel-lag
description:
  purpose: Published per-language Babel Lag table (dbt mart_language_index), JSON Schema validated.
  usage: Aggregates for the Babel Lag site and method; never per-editor analysis.
  limitations: Wikipedia only; milestone 2 covers a 20-language slice (ADR-007).
team:
- username: babel-lag
  role: owner
servers:
- server: local
  type: local
  format: delta
  path: export/v1/languages.json
schema:
- name: export_languages
  physicalName: export_languages
  physicalType: table
  logicalType: object
  description: Published per-language Babel Lag table (dbt mart_language_index), JSON Schema validated.
  tags:
  - export
  - public-aggregate
  properties:
  - name: wiki
    logicalType: string
    physicalType: string
    description: Language edition.
    classification: public
  - name: language
    logicalType: string
    physicalType: string
    description: Language code.
    classification: public
  - name: items_covered
    logicalType: string
    physicalType: string
    description: Reference items covered.
    classification: public
  - name: items_first
    logicalType: string
    physicalType: string
    description: Items this language covered first.
    classification: public
  - name: coverage_pct
    logicalType: string
    physicalType: string
    description: Share of reference items covered, percent.
    classification: public
  - name: median_lag_days
    logicalType: string
    physicalType: string
    description: Median coverage lag in days.
    classification: public
  - name: pageviews
    logicalType: string
    physicalType: string
    description: Human pageviews of this language's articles over the pageview days.
    classification: public
  - name: demand_without_supply
    logicalType: string
    physicalType: string
    description: Views elsewhere of reference items this language lacks (proxy).
    classification: public
  - name: median_depth_ratio
    logicalType: string
    physicalType: string
    description: Median article size relative to the first language's article.
    classification: public
  - name: reference_set
    logicalType: string
    physicalType: string
    description: The language set coverage is measured against (slice20 or all).
    classification: public
slaProperties:
- property: frequency
  value: 30
  unit: m
tags:
- babel-lag
- export
customProperties:
- property: license
  value: CC0 (Wikimedia)
- property: containsPersonalData
  value: 'false'
