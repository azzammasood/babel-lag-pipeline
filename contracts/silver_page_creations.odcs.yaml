apiVersion: v3.0.2
kind: DataContract
id: babel-lag-silver-page-creations
name: silver_page_creations
version: 1.0.0
status: active
domain: knowledge-spread
dataProduct: babel-lag
description:
  purpose: One row per article with its first revision and revision counts.
  usage: Aggregates for the Babel Lag site and method; never per-editor analysis.
  limitations: Wikipedia only; milestone 2 covers a 20-language slice (ADR-007).
team:
- username: babel-lag
  role: owner
servers:
- server: local
  type: local
  format: delta
  path: data/lake/silver/silver_page_creations
schema:
- name: silver_page_creations
  physicalName: silver_page_creations
  physicalType: table
  logicalType: object
  description: One row per article with its first revision and revision counts.
  tags:
  - silver
  - public-aggregate
  properties:
  - name: wiki
    logicalType: string
    physicalType: 'arro3.core.DataType<Utf8>

      '
    description: Wiki database name.
    classification: public
  - name: page_id
    logicalType: string
    physicalType: 'arro3.core.DataType<Int64>

      '
    description: Page id.
    classification: public
  - name: page_title
    logicalType: string
    physicalType: 'arro3.core.DataType<Utf8>

      '
    description: Current page title.
    classification: public
  - name: created_at
    logicalType: string
    physicalType: 'arro3.core.DataType<Timestamp(µs, "UTC")>

      '
    description: Time of the earliest revision in the history (UTC).
    classification: public
  - name: created_by_bot
    logicalType: string
    physicalType: 'arro3.core.DataType<Boolean>

      '
    description: True when the first revision was made by a bot.
    classification: public
  - name: is_redirect
    logicalType: string
    physicalType: 'arro3.core.DataType<Boolean>

      '
    description: True when the page is currently a redirect.
    classification: public
  - name: is_deleted
    logicalType: string
    physicalType: 'arro3.core.DataType<Boolean>

      '
    description: True when the page is deleted.
    classification: public
  - name: revisions
    logicalType: string
    physicalType: 'arro3.core.DataType<Int64>

      '
    description: Revisions of the page.
    classification: public
  - name: human_revisions
    logicalType: string
    physicalType: 'arro3.core.DataType<Int64>

      '
    description: Revisions not made by bots.
    classification: public
  - name: reverted_revisions
    logicalType: string
    physicalType: 'arro3.core.DataType<Int64>

      '
    description: Revisions later identity-reverted.
    classification: public
  - name: last_rev_ts
    logicalType: string
    physicalType: 'arro3.core.DataType<Timestamp(µs, "UTC")>

      '
    description: Time of the latest revision.
    classification: public
  - name: last_rev_bytes
    logicalType: string
    physicalType: 'arro3.core.DataType<Int64>

      '
    description: Current article size in bytes (latest revision).
    classification: public
slaProperties:
- property: frequency
  value: 44640
  unit: m
tags:
- babel-lag
- silver
customProperties:
- property: license
  value: CC0 (Wikimedia)
- property: containsPersonalData
  value: 'false'
