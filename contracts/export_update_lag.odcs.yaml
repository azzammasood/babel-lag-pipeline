apiVersion: v3.0.2
kind: DataContract
id: babel-lag-export-update-lag
name: export_update_lag
version: 1.0.0
status: active
domain: knowledge-spread
dataProduct: babel-lag
description:
  purpose: Published update lag per language (slice20), JSON Schema validated.
  usage: Aggregates for the Babel Lag site and method; never per-editor analysis.
  limitations: Wikipedia only; milestone 2 covers a 20-language slice (ADR-007).
team:
- username: babel-lag
  role: owner
servers:
- server: local
  type: local
  format: delta
  path: export/v1/update_lag.json
schema:
- name: export_update_lag
  physicalName: export_update_lag
  physicalType: table
  logicalType: object
  description: Published update lag per language (slice20), JSON Schema validated.
  tags:
  - export
  - public-aggregate
  properties:
  - name: wiki
    logicalType: string
    physicalType: string
    description: Language edition.
    classification: public
  - name: items_with_event
    logicalType: string
    physicalType: string
    description: Multi-language items with a burst event in the last 12 months whose article in this language
      predates the event.
    classification: public
  - name: items_first
    logicalType: string
    physicalType: string
    description: Events this language led (burst on the event's start day).
    classification: public
  - name: items_followed
    logicalType: string
    physicalType: string
    description: Events this language followed with its own burst within 30 days.
    classification: public
  - name: updated_pct
    logicalType: string
    physicalType: string
    description: Share of events this language led or followed within 30 days, percent.
    classification: public
  - name: median_follow_lag_days
    logicalType: string
    physicalType: string
    description: 'Median days from event start to this language''s burst, over followed events (small
      samples: read with items_followed).'
    classification: public
  - name: reference_set
    logicalType: string
    physicalType: string
    description: 'slice20: daily edit series exist for the 20-language slice only.'
    classification: public
slaProperties:
- property: frequency
  value: 44640
  unit: m
tags:
- babel-lag
- export
customProperties:
- property: license
  value: CC0 (Wikimedia)
- property: containsPersonalData
  value: 'false'
