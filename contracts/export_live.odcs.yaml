apiVersion: v3.0.2
kind: DataContract
id: babel-lag-export-live
name: export_live
version: 1.0.0
status: active
domain: knowledge-spread
dataProduct: babel-lag
description:
  purpose: Published hourly live activity per wiki for the last 48 hours (dbt mart_live_hourly).
  usage: Aggregates for the Babel Lag site and method; never per-editor analysis.
  limitations: Wikipedia only; milestone 2 covers a 20-language slice (ADR-007).
team:
- username: babel-lag
  role: owner
servers:
- server: local
  type: local
  format: delta
  path: export/v1/live.json
schema:
- name: export_live
  physicalName: export_live
  physicalType: table
  logicalType: object
  description: Published hourly live activity per wiki for the last 48 hours (dbt mart_live_hourly).
  tags:
  - export
  - public-aggregate
  properties:
  - name: hour
    logicalType: string
    physicalType: string
    description: Hour (UTC).
    classification: public
  - name: wiki
    logicalType: string
    physicalType: string
    description: Wiki database name.
    classification: public
  - name: events
    logicalType: string
    physicalType: string
    description: On-time events.
    classification: public
  - name: late_events
    logicalType: string
    physicalType: string
    description: Late events.
    classification: public
  - name: human_article_edits
    logicalType: string
    physicalType: string
    description: Non-bot article edits.
    classification: public
  - name: new_articles
    logicalType: string
    physicalType: string
    description: Non-bot new articles.
    classification: public
  - name: bot_events
    logicalType: string
    physicalType: string
    description: Bot events.
    classification: public
slaProperties:
- property: frequency
  value: 30
  unit: m
tags:
- babel-lag
- export
customProperties:
- property: license
  value: CC0 (Wikimedia)
- property: containsPersonalData
  value: 'false'
