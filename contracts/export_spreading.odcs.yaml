apiVersion: v3.0.2
kind: DataContract
id: babel-lag-export-spreading
name: export_spreading
version: 1.0.0
status: active
domain: knowledge-spread
dataProduct: babel-lag
description:
  purpose: Published live topic spread (items with new articles in 2+ languages, last 48 h).
  usage: Aggregates for the Babel Lag site and method; never per-editor analysis.
  limitations: Wikipedia only; milestone 2 covers a 20-language slice (ADR-007).
team:
- username: babel-lag
  role: owner
servers:
- server: local
  type: local
  format: delta
  path: export/v1/spreading.json
schema:
- name: export_spreading
  physicalName: export_spreading
  physicalType: table
  logicalType: object
  description: Published live topic spread (items with new articles in 2+ languages, last 48 h).
  tags:
  - export
  - public-aggregate
  properties:
  - name: item_id
    logicalType: string
    physicalType: string
    description: Wikidata item number.
    classification: public
  - name: wiki
    logicalType: string
    physicalType: string
    description: Language edition.
    classification: public
  - name: created_at
    logicalType: string
    physicalType: string
    description: Creation time of this language's new article (UTC, event time).
    classification: public
  - name: first_created_at
    logicalType: string
    physicalType: string
    description: Creation time of the item's first new article in the window.
    classification: public
  - name: lag_hours
    logicalType: string
    physicalType: string
    description: Hours after the first new article.
    classification: public
  - name: languages
    logicalType: string
    physicalType: string
    description: Languages with a new article for the item in the window.
    classification: public
slaProperties:
- property: frequency
  value: 30
  unit: m
tags:
- babel-lag
- export
customProperties:
- property: license
  value: CC0 (Wikimedia)
- property: containsPersonalData
  value: 'false'
