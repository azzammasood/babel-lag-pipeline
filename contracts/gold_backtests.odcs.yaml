apiVersion: v3.0.2
kind: DataContract
id: babel-lag-gold-backtests
name: gold_backtests
version: 1.0.0
status: active
domain: knowledge-spread
dataProduct: babel-lag
description:
  purpose: Per-language creation lag of the backtest items (20 items first created 2020-2024 with the
    most languages).
  usage: Aggregates for the Babel Lag site and method; never per-editor analysis.
  limitations: Wikipedia only; milestone 2 covers a 20-language slice (ADR-007).
team:
- username: babel-lag
  role: owner
servers:
- server: local
  type: local
  format: delta
  path: release
schema:
- name: gold_backtests
  physicalName: gold_backtests
  physicalType: table
  logicalType: object
  description: Per-language creation lag of the backtest items (20 items first created 2020-2024 with
    the most languages).
  tags:
  - gold
  - public-aggregate
  properties:
  - name: item_id
    logicalType: string
    physicalType: 'arro3.core.DataType<Int64>

      '
    description: Wikidata item number.
    classification: public
  - name: wiki
    logicalType: string
    physicalType: 'arro3.core.DataType<Utf8>

      '
    description: Language edition.
    classification: public
  - name: created_at
    logicalType: string
    physicalType: 'arro3.core.DataType<Timestamp(µs, "UTC")>

      '
    description: Creation time of this language's article (UTC).
    classification: public
  - name: first_created_at
    logicalType: string
    physicalType: 'arro3.core.DataType<Timestamp(µs, "UTC")>

      '
    description: Creation time of the item's first article (UTC).
    classification: public
  - name: lag_seconds
    logicalType: string
    physicalType: 'arro3.core.DataType<Int64>

      '
    description: created_at minus first_created_at in seconds.
    classification: public
  - name: lag_days
    logicalType: string
    physicalType: 'arro3.core.DataType<Float64>

      '
    description: The same lag in days, rounded to 0.01.
    classification: public
  - name: languages
    logicalType: string
    physicalType: 'arro3.core.DataType<Int64>

      '
    description: Languages with an eligible article for the item.
    classification: public
slaProperties:
- property: frequency
  value: 44640
  unit: m
tags:
- babel-lag
- gold
customProperties:
- property: license
  value: CC0 (Wikimedia)
- property: containsPersonalData
  value: 'false'
