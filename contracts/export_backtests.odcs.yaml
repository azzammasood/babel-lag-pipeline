apiVersion: v3.0.2
kind: DataContract
id: babel-lag-export-backtests
name: export_backtests
version: 1.0.0
status: active
domain: knowledge-spread
dataProduct: babel-lag
description:
  purpose: Published backtests (spread of 20 recent topics across languages), JSON Schema validated.
  usage: Aggregates for the Babel Lag site and method; never per-editor analysis.
  limitations: Wikipedia only; milestone 2 covers a 20-language slice (ADR-007).
team:
- username: babel-lag
  role: owner
servers:
- server: local
  type: local
  format: delta
  path: export/v1/backtests.json
schema:
- name: export_backtests
  physicalName: export_backtests
  physicalType: table
  logicalType: object
  description: Published backtests (spread of 20 recent topics across languages), JSON Schema validated.
  tags:
  - export
  - public-aggregate
  properties:
  - name: item_id
    logicalType: string
    physicalType: string
    description: Wikidata item number.
    classification: public
  - name: wiki
    logicalType: string
    physicalType: string
    description: Language edition.
    classification: public
  - name: created_at
    logicalType: string
    physicalType: string
    description: Creation time of this language's article (UTC).
    classification: public
  - name: first_created_at
    logicalType: string
    physicalType: string
    description: Creation time of the item's first article (UTC).
    classification: public
  - name: lag_days
    logicalType: string
    physicalType: string
    description: Lag to the first article in days.
    classification: public
  - name: languages
    logicalType: string
    physicalType: string
    description: Languages with an eligible article for the item.
    classification: public
slaProperties:
- property: frequency
  value: 44640
  unit: m
tags:
- babel-lag
- export
customProperties:
- property: license
  value: CC0 (Wikimedia)
- property: containsPersonalData
  value: 'false'
