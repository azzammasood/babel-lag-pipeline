# Same models on both targets (brief section 5): duckdb is `free`, databricks is `full`.
babel_lag:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      path: "{{ env_var('BABEL_DATA', '../data') }}/warehouse/babel.duckdb"
      extensions: [delta]
      threads: 2
      settings:
        memory_limit: "2GB"
        TimeZone: UTC
    databricks:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', 'unset') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', 'unset') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', 'unset') }}"
      catalog: workspace
      schema: babel_marts
      threads: 2
