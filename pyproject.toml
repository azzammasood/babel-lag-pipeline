[project]
name = "babel-lag"
version = "0.1.0"
description = "How long until new knowledge reaches each language on Wikipedia."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deltalake>=1.6.6",
    "duckdb>=1.5",
    "httpx>=0.28",
    "jsonschema>=4.26",
    "openlineage-python>=1.55.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "orjson>=3.13",
    "psutil>=6.0",
    "pyarrow>=26.0",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.scripts]
babel = "babel_lag.cli:app"

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pytest>=8.2",
    "ruff>=0.17",
]
orchestrate = [
    "dagster>=1.13.29",
    "dagster-webserver>=1.13.29",
]
spark = [
    "delta-spark>=4.0",
    "pyspark>=4.0",
]
stream = [
    "confluent-kafka[avro,schemaregistry]>=2.16.1",
    "fastavro>=1.13.1",
]
warehouse = [
    "dbt-core>=1.12.6",
    "dbt-databricks>=1.13.0",
    "dbt-duckdb>=1.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/babel_lag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH"]

[tool.ruff.lint.per-file-ignores]
"src/babel_lag/cli.py" = ["B008"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: talks to a real host; skipped unless BABEL_NETWORK_TESTS=1",
]
